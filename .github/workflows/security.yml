name: security

# Runs on pull requests and weekly. The weekly run is the point: a new advisory
# against a dependency nobody touched will not surface any other way.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 0'

# Least privilege: govulncheck and gosec only read the checkout. CodeQL, when it
# is re-enabled, additionally needs `security-events: write` to upload results
# and `actions: read` to fetch workflow run metadata.
permissions:
  contents: read

jobs:
  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # Pinned, not @latest: an unpinned install means CI executes whatever the
      # upstream published moments earlier, with no review. The vulnerability
      # database is fetched at run time regardless, so pinning the tool costs no
      # freshness.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # Vendored dependencies are excluded: they are not ours to fix, and left in
      # they drown the signal — 3846 findings across the tree versus 0 in this
      # codebase. LOW is skipped because it is almost entirely G104 (unhandled
      # errors), which errcheck already governs under this project's own policy.
      - name: install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
      - run: make security

  # Surface scheduled-run failures loudly. On a private repo the weekly cron
  # has no reviewer watching the Actions tab, which is exactly how govulncheck
  # stayed red for five weeks unnoticed (#140). A required status check would
  # instead block unrelated PRs whenever the vuln database flags an untouched
  # dependency, so this stays advisory on PRs and only raises an alarm on the
  # schedule: it files (or refreshes) a single tracking issue rather than
  # gating merges. Runs only for `schedule`, only when a scan job failed.
  notify-scheduled-failure:
    name: notify on scheduled failure
    needs: [vulncheck, gosec]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: open or refresh tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled security scan is failing"
          body="The weekly \`security\` workflow failed on its scheduled run.

          Run: $RUN_URL

          This is advisory (not a merge gate). A failure usually means a new
          advisory landed against a dependency — triage and bump, see #140."
          existing=$(gh issue list --state open --label security-scan \
            --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label security-scan --body "$body"
          fi

  # CodeQL is disabled until this repository is public.
  #
  # Code scanning requires GitHub Code Security, which on a private repository
  # is a paid Advanced Security feature; the job failed with "Code Security must
  # be enabled for this repository to use code scanning". It becomes available
  # at no cost the moment the repo goes public, which is the same gate as
  # private vulnerability reporting.
  #
  # To re-enable: uncomment this job and restore the two permissions it needs,
  # noted in the permissions block above.
  #
  # codeql:
  #   name: codeql
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-go@v5
  #       with:
  #         go-version-file: go.mod
  #         cache-dependency-path: go.sum
  #     - uses: github/codeql-action/init@v3
  #       with:
  #         languages: go
  #     - uses: github/codeql-action/autobuild@v3
  #     - uses: github/codeql-action/analyze@v3
