{{- if .Values.ingress.enabled }}
{{- if .Values.ingress.managedCertificate.enabled }}
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: {{ include "accretion-api.fullname" . }}-ssl-cert
  labels:
    {{- include "accretion-api.labels" . | nindent 4 }}
spec:
  domains:
    {{- range .Values.ingress.managedCertificate.domains }}
    - {{ . | quote }}
    {{- end }}
{{- end }}
{{- end }}
