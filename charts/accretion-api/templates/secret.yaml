{{- /*
Chart-owned Secret holding the database password (key: db-password).

Rendered only when the operator has NOT supplied config.database.existingSecret.
It uses a distinct name ("<fullname>-db") rather than "accretion-api-secrets"
so it never clobbers the externally-provisioned secret that also holds
oauth-client-id, session-key, and other keys.

For prod, set config.database.existingSecret to an operator-managed secret (with
a db-password key) so no plaintext password flows through Helm values. Dev uses
config.database.password as the source (dev-only default).
*/ -}}
{{- if not .Values.config.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "accretion-api.dbSecretName" . }}
  labels:
    {{- include "accretion-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-password: {{ .Values.config.database.password | quote }}
{{- end }}

{{- /*
Per-client API-key plaintext, one `api-key-<name>` entry per identity that
declares a `key`. This is the *other half* of the digest rendered into the
ConfigMap: both derive from the single `apiKeys` list, so the verifier and the
client cannot drift. There is no shared value — the Discord bot, each MCP
client, and CI each read their own entry and can be revoked on their own.

Identities configured by `hash` contribute nothing here by design: their
plaintext never enters the Helm release and is distributed out-of-band.
*/ -}}
{{- $clientKeys := list }}
{{- range .Values.apiKeys }}
{{- if .key }}
{{- $clientKeys = append $clientKeys . }}
{{- end }}
{{- end }}
{{- if $clientKeys }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "accretion-api.clientKeysSecretName" . }}
  labels:
    {{- include "accretion-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $clientKeys }}
  api-key-{{ .name }}: {{ .key | quote }}
  {{- end }}
{{- end }}
