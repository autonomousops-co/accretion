{{- /*
Chart-owned Secret holding the database password (key: db-password), read by
the schema Job and the partition-maintenance CronJob through secretKeyRef.

Rendered only when the operator has NOT supplied config.database.existingSecret.
It uses a distinct name ("<fullname>-db") so it never collides with the
operator-provisioned accretion-db-secrets, which also carries the subchart's
postgres-password: one object, one owner -- a Helm-created Secret and a
kubectl-created one of the same name fight.

b64 `data`, not `stringData`: the rendered manifest is what `helm template`
prints and what gates scan, and there is no reason for the value to appear in it
verbatim. That is a hygiene margin, not a security boundary -- base64 is not
encryption, and a Secret is where a credential is meant to live.

Before #134 there was no Secret here at all: both jobs carried the password as a
plaintext env `value:` in their pod manifests, where `get pod` reads it.

The data KEY comes through accretion-db.dbSecretKey rather than being restated
as a literal. _helpers.tpl argues that spelling a Secret's name and its key
separately at each call site is how one of them drifts, and that argument
applies to this file as much as to the two jobs: on this branch the helper
resolves to "db-password", and if that ever changes, the jobs' secretKeyRef and
this Secret move together.
*/ -}}
{{- if not .Values.config.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "accretion-db.dbSecretName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "accretion-db.labels" . | nindent 4 }}
type: Opaque
data:
  {{ include "accretion-db.dbSecretKey" . }}: {{ .Values.config.database.password | b64enc | quote }}
{{- end }}
