apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "accretion-db.fullname" . }}-schema
  labels:
    {{- include "accretion-db.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.schemaJob.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "accretion-db.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.schemaJob.image }}
          command:
            - sh
            - -c
            - |
              elapsed=0
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"; do
                echo "Waiting for PostgreSQL... (${elapsed}s)"
                sleep 2
                elapsed=$((elapsed + 2))
                if [ "$elapsed" -ge 90 ]; then
                  echo "Timed out waiting for PostgreSQL after ${elapsed}s"
                  exit 1
                fi
              done
          env:
            - name: PGHOST
              value: {{ .Values.config.database.host | quote }}
            - name: PGPORT
              value: {{ .Values.config.database.port | quote }}
            - name: PGUSER
              value: {{ .Values.config.database.user | quote }}
      containers:
        - name: schema
          image: {{ .Values.schemaJob.image }}
          command:
            - sh
            - -c
            - |
              psql -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '$PGDATABASE'" | grep -q 1 || psql -d postgres -c "CREATE DATABASE $PGDATABASE"
              psql -d "$PGDATABASE" -f /sql/schema.sql
              echo ""
              echo "=== Tables ==="
              psql -d "$PGDATABASE" -c "SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename;"
              echo "=== Indexes ==="
              psql -d "$PGDATABASE" -c "SELECT indexname, tablename FROM pg_indexes WHERE schemaname='public' ORDER BY tablename, indexname;"
          env:
            - name: PGHOST
              value: {{ .Values.config.database.host | quote }}
            - name: PGPORT
              value: {{ .Values.config.database.port | quote }}
            - name: PGUSER
              value: {{ .Values.config.database.user | quote }}
            # From a Secret, never a literal (#134). This rendered as a
            # plaintext env `value:` in the Job's pod manifest, where anyone
            # holding `get pod` in this namespace could read it -- far below the
            # `get secrets` bar that reading a Secret requires. psql takes
            # PGPASSWORD from the environment either way, so the credential's
            # path to the process is unchanged; only its path into the manifest
            # is. Deliberately not `optional`: an absent key must fail the Job
            # at rollout, not leave the variable unset so psql prompts and the
            # schema silently never gets applied.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "accretion-db.dbSecretName" . }}
                  key: {{ include "accretion-db.dbSecretKey" . }}
            - name: PGDATABASE
              value: {{ .Values.config.database.database | quote }}
          volumeMounts:
            - name: schema
              mountPath: /sql
      volumes:
        - name: schema
          configMap:
            name: {{ include "accretion-db.fullname" . }}-schema
