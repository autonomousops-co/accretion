{{/*
Gated on scale-out, the same condition as templates/redis.yaml and
templates/controller-deployment.yaml (#93). Redis deploys only when a collector
is actually scaled out, and in the default install nothing references this
Secret at all -- no secretKeyRef points at it, and the only other mention is a
comment in the ConfigMap. It was rendered unconditionally anyway, which was
harmless while redis.auth.password shipped a working default and became a
chart that could not render at all the moment that default was emptied: every
collector Deployment includes this file to compute a checksum annotation, so
the `fail` below evaluated on EVERY render, including installs that deploy no
Redis.

So the guard now fires when there is a Redis to protect, which is what it was
always for, and a default `helm install` no longer has to supply a password for
a server it is not deploying.
*/}}
{{- if and .Values.redis.auth.enabled (include "accretion-collector.scaleOutEnabled" .) }}
{{- if .Values.redis.auth.existingSecret }}
{{/*
existingSecret set (#113): the chart renders no redis-secret of its own and
never sees redis.auth.password. It can still assert the two KEY NAMES it will
reference are non-empty -- a chart that forgot to wire one up should fail here,
at render time, rather than independently at a client's secretKeyRef or the
Redis pod's volume mount during rollout. It cannot go further than that: it has
no way to confirm your actual Secret carries both keys without cluster access,
which `helm template`/`helm lint` never have.
*/}}
{{- if not .Values.redis.auth.existingSecretPasswordKey }}
{{- fail "redis.auth.existingSecret is set but redis.auth.existingSecretPasswordKey is empty -- every client (the controller and data-collector processes) reads the password from this key via secretKeyRef and needs a name. Set it (default \"password\"), or clear redis.auth.existingSecret to let the chart manage its own Secret." }}
{{- end }}
{{- if not .Values.redis.auth.existingSecretConfKey }}
{{- fail "redis.auth.existingSecret is set but redis.auth.existingSecretConfKey is empty -- the Redis server mounts this key as its requirepass config file (templates/redis.yaml) and needs a name. Set it (default \"redis.conf\"), or clear redis.auth.existingSecret to let the chart manage its own Secret. Your Secret must carry BOTH this key and existingSecretPasswordKey: redis-server has no env-var form of requirepass, so the server reads this config-file key while every client reads the password key -- a Secret with only one renders fine and fails at rollout instead." }}
{{- end }}
{{- else }}
{{- if not .Values.redis.auth.password }}
{{- fail "redis.auth.password must be set. You are seeing this because a collector is scaled out, which deploys Redis to hold the controller's pod-assignment state, and no password is configured for it. Set redis.auth.password, or better, set redis.auth.existingSecret to a Secret you created out of band so the password never enters the Helm release. DO NOT reach for redis.auth.enabled=false to make this message stop: that does not remove the Redis, it deploys a complete and working one with no authentication at all, holding the collector queue, reachable by anything that can open the port. It exists for a cluster where Redis is protected some other way, not as a way past this error." }}
{{- end }}
{{- if regexMatch "[^\\x20-\\x7e]" .Values.redis.auth.password }}
{{- fail "redis.auth.password must be printable ASCII (0x20-0x7E). Go's %q and redis.conf's own quoted-string syntax do not agree on every escape for anything outside that range -- confirmed for \\v, \\f, and non-ASCII characters like U+00A0, each dropped silently on one side or the other, the same class of bug this file has already shipped twice under two different encoders. Rather than enumerate a third exception list, printable ASCII is the range both sides are known to agree on: only \" and \\ need escaping there, and both round-trip correctly." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "accretion-collector.redisSecretName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "accretion-collector.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.redis.auth.password | b64enc | quote }}
  # A config-file directive, not the raw password: redis-server has no
  # env-var form of requirepass (see templates/redis.yaml). %q double-quotes
  # the value the way redis.conf's own string syntax expects, so a password
  # containing a space renders as a valid directive rather than a boot-time
  # FATAL CONFIG FILE ERROR, and one containing a newline or a quote renders
  # escaped inside that quoted string rather than a second, attacker-
  # controlled directive line (cycle-1 review found both live). NOT toJson:
  # json.Marshal HTML-escapes & < > into \u00XX, which redis.conf's parser
  # does not understand -- it takes an unrecognized \u escape's next
  # characters literally, so an ordinary "&" in the password silently
  # produces a DIFFERENT password server-side than the one every client
  # sends (cycle-2 review, verified against a live server; toJson was itself
  # a cycle-1 fix for the previous, unquoted bug). %q is Go's own string
  # quoting, not HTML-safe encoding, so & stays & -- but %q is not limited
  # to escaping the closing quote, backslash and newline: it also escapes
  # every non-printable character via \xHH or \uXXXX, a class redis.conf's
  # parser does not fully agree with either (cycle-3 review: \v, \f and
  # U+00A0 each confirmed silently dropped on one side or the other). The
  # guard above is what actually closes that: restricted to printable
  # ASCII, the only two characters %q ever escapes here are " and \, and
  # both are confirmed to round-trip correctly.
  redis.conf: {{ printf "requirepass %q\n" .Values.redis.auth.password | b64enc | quote }}
{{- end }}
{{- end }}

{{- if .Values.config.database.existingSecret }}
{{/*
existingSecret set (#113): no postgresql-secret of our own, and
config.database.password is never read. Same render-time assertion as the
Redis existingSecretPasswordKey/existingSecretConfKey guards above, and the
same limit -- it can confirm the key NAME is non-empty, not that your Secret
actually contains it.
*/}}
{{- if not .Values.config.database.existingSecretKey }}
{{- fail "config.database.existingSecret is set but config.database.existingSecretKey is empty -- every container/initContainer that reads the database password reads this key via secretKeyRef and needs a name. Set it (default \"password\"), or clear config.database.existingSecret to let the chart manage its own Secret." }}
{{- end }}
{{- else }}
{{/*
No existingSecret and no password is REFUSED here rather than defaulted (#134).
This chart shipped `postgres` in its own values.yaml until then, so a default
install brought up collectors talking to a database whose password is published
in this repository -- and because the value renders into a chart-owned Secret
rather than into a pod manifest, nothing at install time said so.

It fails rather than generating one, for the same reason the Redis guard above
does: a generated password is a password no client holds, so the render and the
install would both succeed and the failure would surface as authentication
errors inside the cluster with no manifest explaining them. The message names
the variable to set, because that is the next thing its reader has to do.

"postgres" is rejected alongside empty. It is not a password, it is the value
this change removed, and accepting it would let a copy of the old values file
walk straight back in.
*/}}
{{- $dbpw := .Values.config.database.password | default "" }}
{{- if or (eq $dbpw "") (eq $dbpw "postgres") }}
{{- fail "SECURITY: no database password. config.database.password is empty or the insecure default \"postgres\", and config.database.existingSecret is not set. Point config.database.existingSecret at a Secret holding the password, with config.database.existingSecretKey naming the key: scripts/make-secret.sh publishes ACCRETION_DATABASE_PASSWORD from your gitignored .env into accretion-api-secrets under db-password, which is what deploy/tilt.yaml and deploy/pulumi.yaml both point this chart at. charts/README.md documents the --set-string escape hatch and why a password passed as a Helm value is readable afterwards with `helm get values`. The chart will not invent one." }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "accretion-collector.postgresqlSecretName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "accretion-collector.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.config.database.password | b64enc | quote }}
{{- end }}
