{{- if and .Values.collector.enabled .Values.collector.serviceAccount.create (include "accretion-collector.scaleOutEnabled" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "accretion-collector.fullname" . }}-collector
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "accretion-collector.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
  {{- with .Values.collector.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
{{- if and .Values.dataCollector.enabled .Values.dataCollector.serviceAccount.create }}
{{- if (include "accretion-collector.sharedDataCollectors" . | fromJsonArray) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "accretion-collector.fullname" . }}-data-collector
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "accretion-collector.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-collector
  {{- with .Values.dataCollector.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- range $name := (include "accretion-collector.splitDataCollectors" . | fromJsonArray) }}
---
# Its own identity, so its ClusterRole can carry only its own rules.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "accretion-collector.fullname" $ }}-{{ $name }}-collector
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "accretion-collector.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}-collector
  {{- with $.Values.dataCollector.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
---
{{- if and .Values.statusCollector.enabled .Values.statusCollector.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "accretion-collector.fullname" . }}-status-collector
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "accretion-collector.labels" . | nindent 4 }}
    app.kubernetes.io/component: status-collector
  {{- with .Values.statusCollector.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
