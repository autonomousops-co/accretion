{{- if .Values.statusCollector.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "accretion-collector.fullname" . }}-status-collector
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "accretion-collector.labels" . | nindent 4 }}
    app.kubernetes.io/component: status-collector
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.statusCollector.autoscaling.enabled }}
  replicas: {{ .Values.statusCollector.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "accretion-collector.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: status-collector
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
      labels:
        {{- include "accretion-collector.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: status-collector
      {{- with .Values.statusCollector.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "accretion-collector.fullname" . }}-status-collector
      securityContext:
        {{- toYaml .Values.statusCollector.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          env:
            # Sourced from the secret rather than templated into the command so
            # the DB password is not baked into the rendered pod manifest or
            # visible in the process list. psql reads PGPASSWORD from the env.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "accretion-collector.postgresqlSecretName" . }}
                  key: {{ include "accretion-collector.postgresqlSecretKey" . }}
          command: ['sh', '-c', 'until pg_isready -h {{ .Values.config.database.host }} -p {{ .Values.config.database.port }} -U {{ .Values.config.database.user }} && psql -h {{ .Values.config.database.host }} -p {{ .Values.config.database.port }} -U {{ .Values.config.database.user }} -d {{ .Values.config.database.database }} -c "SELECT 1" > /dev/null 2>&1; do echo waiting for postgres database {{ .Values.config.database.database }}; sleep 2; done;']
      containers:
        - name: status-collector
          securityContext:
            {{- toYaml .Values.statusCollector.securityContext | nindent 12 }}
          image: "{{ .Values.statusCollector.image.repository }}:{{ .Values.statusCollector.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.statusCollector.image.pullPolicy }}
          command: ["./accretion-api"]
          args: ["status", "--config", "/etc/config/config.yaml"]
          env:
            # DB password sourced from postgresql-secret, not the ConfigMap;
            # see templates/configmap.yaml for why.
            - name: ACCRETION_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "accretion-collector.postgresqlSecretName" . }}
                  key: {{ include "accretion-collector.postgresqlSecretKey" . }}
            # Soft heap cap; the informer caches scale with the objects watched.
            # See statusCollector.goMemLimit in values.yaml.
            - name: GOMEMLIMIT
              value: {{ required "statusCollector.goMemLimit must be set" .Values.statusCollector.goMemLimit | quote }}
          volumeMounts:
            - name: config
              mountPath: /etc/config
              readOnly: true
          ports:
            - name: http
              containerPort: {{ .Values.statusCollector.service.targetPort }}
              protocol: TCP
          # Liveness stays on /health, which is unconditional. A single wedged
          # collector must not restart the pod and take the seven healthy ones
          # with it -- the in-process supervisor restarts the failing one, and
          # /ready below is what makes the degradation visible.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.statusCollector.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "accretion-collector.fullname" . }}-config
      {{- with .Values.statusCollector.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.statusCollector.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.statusCollector.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
