{{/*
Autoscaling for the data collectors (#92). The shared process gets one HPA; a
split-out collector gets its own, which is the point of splitting -- an operator
whose log volume needs dedicated scaled workers splits `log` out and scales that
Deployment without touching metric, event or trace.
*/}}
{{- define "accretion-collector.dataCollectorHPASpec" -}}
{{- $auto := .autoscaling }}
  minReplicas: {{ $auto.minReplicas }}
  maxReplicas: {{ $auto.maxReplicas }}
  metrics:
    {{- if $auto.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $auto.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if $auto.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $auto.targetMemoryUtilizationPercentage }}
    {{- end }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
{{- end -}}

{{- if .Values.dataCollector.enabled }}
{{- $shared := include "accretion-collector.sharedDataCollectors" . | fromJsonArray }}
{{- if and $shared .Values.dataCollector.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "accretion-collector.fullname" . }}-data-collector
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "accretion-collector.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-collector
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "accretion-collector.fullname" . }}-data-collector
{{- include "accretion-collector.dataCollectorHPASpec" (dict "autoscaling" .Values.dataCollector.autoscaling) }}
{{- end }}

{{- range $name := (include "accretion-collector.splitDataCollectors" . | fromJsonArray) }}
{{- $spec := index $.Values.dataCollector.kinds $name }}
{{- if $spec.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "accretion-collector.fullname" $ }}-{{ $name }}-collector
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "accretion-collector.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}-collector
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "accretion-collector.fullname" $ }}-{{ $name }}-collector
{{- include "accretion-collector.dataCollectorHPASpec" (dict "autoscaling" $spec.autoscaling) }}
{{- end }}
{{- end }}
{{- end }}
