{{/*
The controller deploys only when a collector is actually scaled out (#93). With
one replica of each and no HPA there is nothing to shard, and the dispatcher
runs inside the collector process instead. Scaling any collector brings this
back automatically -- see accretion-collector.scaleOutEnabled.
*/}}
{{- if and .Values.collector.enabled (include "accretion-collector.scaleOutEnabled" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "accretion-collector.fullname" . }}-controller
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "accretion-collector.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.collector.replicaCount }}
  selector:
    matchLabels:
      {{- include "accretion-collector.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: collector
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
      labels:
        {{- include "accretion-collector.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: collector
      {{- with .Values.collector.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "accretion-collector.fullname" . }}-collector
      securityContext:
        {{- toYaml .Values.collector.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "accretion-collector.postgresqlSecretName" . }}
                  key: {{ include "accretion-collector.postgresqlSecretKey" . }}
          command: ['sh', '-c', 'until pg_isready -h {{ .Values.config.database.host }} -p {{ .Values.config.database.port }} -U {{ .Values.config.database.user }} && psql -h {{ .Values.config.database.host }} -p {{ .Values.config.database.port }} -U {{ .Values.config.database.user }} -d {{ .Values.config.database.database }} -c "SELECT 1" > /dev/null 2>&1; do echo waiting for postgres database {{ .Values.config.database.database }}; sleep 2; done;']
        - name: wait-for-redis
          image: redis:7-alpine
          {{- if .Values.redis.auth.enabled }}
          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "accretion-collector.redisSecretName" . }}
                  key: {{ include "accretion-collector.redisSecretPasswordKey" . }}
          {{- end }}
          command: ['sh', '-c', 'until redis-cli -h {{ .Release.Name }}-redis-master -p {{ .Values.config.redis.port }} ping; do echo waiting for redis; sleep 2; done;']
      containers:
        - name: collector
          securityContext:
            {{- toYaml .Values.collector.securityContext | nindent 12 }}
          image: "{{ .Values.collector.image.repository }}:{{ .Values.collector.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.collector.image.pullPolicy }}
          command: ["./accretion-api"]
          args: ["collector", "--config", "/etc/config/config.yaml"]
          env:
            # DB/queue passwords sourced from secrets, not the ConfigMap; see
            # templates/configmap.yaml for why.
            - name: ACCRETION_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "accretion-collector.postgresqlSecretName" . }}
                  key: {{ include "accretion-collector.postgresqlSecretKey" . }}
            {{- if .Values.redis.auth.enabled }}
            # No needsQueue gate here (unlike the data collectors): this
            # Deployment only renders under scale-out, where queueMode is
            # always "redis".
            - name: ACCRETION_QUEUE_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "accretion-collector.redisSecretName" . }}
                  key: {{ include "accretion-collector.redisSecretPasswordKey" . }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/config
              readOnly: true
          ports:
            - name: http
              containerPort: {{ .Values.collector.service.targetPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "accretion-collector.fullname" . }}-config
      {{- with .Values.collector.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.collector.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.collector.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
