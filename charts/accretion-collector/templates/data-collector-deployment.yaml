{{/*
The log, metric, event and trace collectors (#92).

By default all four run as supervised goroutines in one shared Deployment. Any
one of them can be split into its own Deployment by setting
dataCollector.kinds.<name>.split=true: the split collector gets a Deployment
running `data-collector --only <name>` with its own replicaCount, autoscaling
and resources, and the shared process drops it (see the collectors block in
configmap.yaml). That is the escape hatch for an operator whose log volume needs
dedicated, scaled workers -- one value, no code change, and the collectors that
were not split keep running exactly as they were.

Both shapes render from this one template so the split and shared pods cannot
drift apart in probes, security context or config wiring.
*/}}
{{- define "accretion-collector.dataCollectorPod" -}}
{{- $root := .root -}}
{{- $name := .name -}}
{{- $args := .args -}}
{{- $spec := .spec -}}
{{- $collectsTraces := .collectsTraces }}
    metadata:
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
        checksum/secret: {{ include (print $root.Template.BasePath "/secrets.yaml") $root | sha256sum }}
        {{- with $root.Values.dataCollector.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "accretion-collector.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
        {{/*
        The OTLP receiver is addressed by the otel-collector at the fixed name
        accretion-collector-trace-worker:4318, so the Service that fronts it
        selects on this label rather than on the component label. That keeps one
        endpoint working whether traces are collected inside the shared process
        or by a split-out Deployment.
        */}}
        accretion.io/collects-traces: {{ $collectsTraces | quote }}
    spec:
      serviceAccountName: {{ include "accretion-collector.dataCollectorServiceAccountName" (dict "root" $root "collector" .splitCollector) }}
      securityContext:
        {{- toYaml $root.Values.dataCollector.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          env:
            # Sourced from the secret rather than templated into the command so
            # the DB password is not baked into the rendered pod manifest or
            # visible in the process list. psql reads PGPASSWORD from the env.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "accretion-collector.postgresqlSecretName" $root }}
                  key: {{ include "accretion-collector.postgresqlSecretKey" $root }}
          command: ['sh', '-c', 'until pg_isready -h {{ $root.Values.config.database.host }} -p {{ $root.Values.config.database.port }} -U {{ $root.Values.config.database.user }} && psql -h {{ $root.Values.config.database.host }} -p {{ $root.Values.config.database.port }} -U {{ $root.Values.config.database.user }} -d {{ $root.Values.config.database.database }} -c "SELECT 1" > /dev/null 2>&1; do echo waiting for postgres database {{ $root.Values.config.database.database }}; sleep 2; done;']
        {{/*
        Only wait on Redis when work actually routes through it. On the default
        single-replica path the dispatcher is in this process and no Redis is
        deployed, so waiting for one would block startup forever (#93).
        */}}
        {{- if and .needsQueue (include "accretion-collector.scaleOutEnabled" $root) }}
        - name: wait-for-redis
          image: redis:7-alpine
          {{- if $root.Values.redis.auth.enabled }}
          env:
            # From redis-secret. See templates/configmap.yaml for why.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "accretion-collector.redisSecretName" $root }}
                  key: {{ include "accretion-collector.redisSecretPasswordKey" $root }}
          {{- end }}
          command: ['sh', '-c', 'until redis-cli -h {{ $root.Release.Name }}-redis-master -p {{ $root.Values.config.redis.port }} ping; do echo waiting for redis; sleep 2; done;']
        {{- end }}
      containers:
        - name: {{ $name }}
          securityContext:
            {{- toYaml $root.Values.dataCollector.securityContext | nindent 12 }}
          image: "{{ $root.Values.dataCollector.image.repository }}:{{ $root.Values.dataCollector.image.tag | default $root.Chart.AppVersion }}"
          imagePullPolicy: {{ $root.Values.dataCollector.image.pullPolicy }}
          command: ["./accretion-api"]
          args: {{ $args | toJson }}
          env:
            # DB/queue passwords sourced from secrets, not the ConfigMap; see
            # templates/configmap.yaml for why.
            - name: ACCRETION_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "accretion-collector.postgresqlSecretName" $root }}
                  key: {{ include "accretion-collector.postgresqlSecretKey" $root }}
            {{- if and .needsQueue (include "accretion-collector.scaleOutEnabled" $root) $root.Values.redis.auth.enabled }}
            # Only wired for a collector that actually routes work through
            # Redis (needsQueue). Same redis-secret as wait-for-redis above.
            - name: ACCRETION_QUEUE_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "accretion-collector.redisSecretName" $root }}
                  key: {{ include "accretion-collector.redisSecretPasswordKey" $root }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/config
              readOnly: true
          ports:
            - name: http
              containerPort: {{ $root.Values.dataCollector.service.targetPort }}
              protocol: TCP
            {{- if eq $collectsTraces "true" }}
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            {{- end }}
          # Liveness is unconditional; readiness follows the supervisor. A single
          # wedged collector must not restart a pod that is still collecting for
          # the others -- the in-process supervisor restarts the failing one.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml $spec.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "accretion-collector.fullname" $root }}-config
      {{- with $root.Values.dataCollector.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.dataCollector.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.dataCollector.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}

{{- if .Values.dataCollector.enabled }}
{{- $shared := include "accretion-collector.sharedDataCollectors" . | fromJsonArray }}
{{- if $shared }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "accretion-collector.fullname" . }}-data-collector
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "accretion-collector.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-collector
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.dataCollector.autoscaling.enabled }}
  replicas: {{ .Values.dataCollector.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "accretion-collector.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: data-collector
  template:
    {{- include "accretion-collector.dataCollectorPod" (dict
          "root" .
          "name" "data-collector"
          "args" (list "data-collector" "--config" "/etc/config/config.yaml")
          "spec" .Values.dataCollector
          "collectsTraces" (ternary "true" "false" (has "trace" $shared))
          "needsQueue" (or (has "log" $shared) (has "metric" $shared))
          "splitCollector" ""
        ) }}
{{- end }}

{{- range $name := (include "accretion-collector.splitDataCollectors" . | fromJsonArray) }}
{{- $spec := index $.Values.dataCollector.kinds $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "accretion-collector.fullname" $ }}-{{ $name }}-collector
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "accretion-collector.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}-collector
  {{- with $.Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not $spec.autoscaling.enabled }}
  replicas: {{ $spec.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "accretion-collector.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}-collector
  template:
    {{- include "accretion-collector.dataCollectorPod" (dict
          "root" $
          "name" (printf "%s-collector" $name)
          "args" (list "data-collector" "--only" $name "--config" "/etc/config/config.yaml")
          "spec" $spec
          "collectsTraces" (ternary "true" "false" (eq $name "trace"))
          "needsQueue" (or (eq $name "log") (eq $name "metric"))
          "splitCollector" $name
        ) }}
{{- end }}
{{- end }}
