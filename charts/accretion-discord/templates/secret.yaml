{{- if and .Values.enabled .Values.secret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "accretion-discord.secretName" . }}
  labels:
    {{- include "accretion-discord.labels" . | nindent 4 }}
type: Opaque
stringData:
  discord-bot-token: {{ .Values.secret.botToken | quote }}
  {{- if .Values.secret.anthropicApiKey }}
  anthropic-api-key: {{ .Values.secret.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secret.openaiApiKey }}
  openai-api-key: {{ .Values.secret.openaiApiKey | quote }}
  {{- end }}
{{- end }}
