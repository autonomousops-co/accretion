{{- if .Values.loki.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "otel-collector.fullname" . }}-loki
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
spec:
  type: {{ .Values.loki.service.type }}
  ports:
    - port: {{ .Values.loki.service.port }}
      targetPort: 3100
      protocol: TCP
      name: http
  selector:
    {{- include "otel-collector.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: loki
{{- end }}
